<VirtualHost *:${PORT}>
    # Only public/ is reachable from the web; src/, vendor/ and .env are not.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None
        # Any URL that is not a real file goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # The base image links these files to stdout/stderr, so Render shows them in its logs.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
